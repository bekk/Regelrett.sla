# Deploy til GCP. Kjører når noe lander på main. Se .github/README.md.
name: Deploy til GCP

on:
  push:
    # Legg til en testbranch her midlertidig for å kjøre deployen før merge.
    branches: [main]
    # Rene dokumentasjonsendringer skal ikke rulle podene. Hopper bare over
    # når alt som er endret er markdown – ligger det kode i samme commit, kjører den.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image-tag som skal deployes på nytt. Tom = bygg fra HEAD.'
        required: false
        default: ''

permissions:
  contents: read
  # Kreves av google-github-actions/auth@v3.
  id-token: write

# Ett miljø, én deploy om gangen. cancel-in-progress må være false: å avbryte
# midt i «kubectl apply» ville etterlatt klyngen halvveis deployet.
concurrency:
  group: deploy-gcp-regelrett-poc
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: gcp-regelrett-poc
    steps:
      - uses: actions/checkout@v7

      # Verdiene leses fra konfigurasjonen, ikke hardkodet her. Da kan de ikke
      # komme i utakt med det som faktisk deployes.
      - name: Les konfigurasjon
        id: cfg
        run: |
          set -euo pipefail
          app=$(yq -r '.app' gcp-config.yaml)
          region=$(yq -r '.gcp.region' gcp-config.yaml)
          ar_repo=$(yq -r '.gcp.repo' gcp-config.yaml)
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag="${GITHUB_SHA:0:7}"
          image="${region}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ar_repo}/${app}"
          {
            echo "region=$region"
            echo "cluster=$(yq -r '.gcp.cluster' gcp-config.yaml)"
            echo "namespace=$(yq -r '.kubernetes.namespace' gcp-config.yaml)"
            echo "deployment=$(yq -r '.kubernetes.deployment' gcp-config.yaml)"
            echo "placeholder=$(yq -r '.kubernetes.image_placeholder' gcp-config.yaml)"
            echo "rollout=$(yq -r '.timeouts.rollout' gcp-config.yaml)"
            echo "tag=$tag"
            echo "image=${image}:${tag}"
            echo "image_latest=${image}:$(yq -r '.gcp.latest_tag' gcp-config.yaml)"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # GKE-kubeconfig bruker exec-plugin, så den må være installert.
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      # Pinnet så kubectl ikke endrer seg med runner-imaget.
      # Bump bevisst, og ikke under det utviklerne kjører lokalt.
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.36.1

      - run: gcloud auth configure-docker '${{ steps.cfg.outputs.region }}-docker.pkg.dev' --quiet

      - uses: docker/setup-buildx-action@v4
        if: inputs.tag == ''

      - name: Bygg og publiser imaget
        if: inputs.tag == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # Uten dette publiseres et ekstra attestation-manifest, som dukker
          # opp som «unknown/unknown»-plattform i Artifact Registry.
          provenance: false
          tags: |
            ${{ steps.cfg.outputs.image }}
            ${{ steps.cfg.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hent kubectl-kontekst
        run: |
          gcloud container clusters get-credentials '${{ steps.cfg.outputs.cluster }}' \
            --region '${{ steps.cfg.outputs.region }}' \
            --project '${{ vars.GCP_PROJECT_ID }}'

      # Ingen kustomize her: manifestene slås sammen med awk, som samtidig
      # normaliserer filer uten avsluttende linjeskift.
      - name: Deploy
        run: |
          set -euo pipefail
          awk 'FNR==1 && NR>1 {print "---"} {print}' k8s/*.yaml \
            | sed "s|${{ steps.cfg.outputs.placeholder }}|${{ steps.cfg.outputs.image }}|g" \
            | kubectl apply -f -
          kubectl -n '${{ steps.cfg.outputs.namespace }}' rollout status \
            'deployment/${{ steps.cfg.outputs.deployment }}' \
            --timeout='${{ steps.cfg.outputs.rollout }}'

      - name: Oppsummering
        if: always()
        run: |
          {
            echo "### Deploy til gcp-regelrett-poc"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`${{ steps.cfg.outputs.image }}\` |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
