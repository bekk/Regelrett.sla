# Testene. Kalles av både pr-build.yml og deploy-main.yml, slik at de kjører
# uansett hvordan en endring lander på main. Se .github/README.md.
name: Tester

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Testene bruker Testcontainers, som trenger Docker på runneren.
      - name: Kotlin-tester
        run: ./gradlew test

      # Må stå før setup-node: cache-oppslaget trenger pnpm på PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: JS-tester
        run: pnpm test

      # Fanger en ødelagt manifest før deployen, ikke under.
      - uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: '0.8.0'

      - name: Schema-valider k8s-manifestene
        run: kubeconform -strict -summary k8s/ k8s/db

    
