# Sjekk som kjører på hver pull request mot main. Se .github/README.md.
name: PR-bygg

on:
  pull_request:
    branches: [main]

# Ingen id-token. PR-bygget skal ikke kunne snakke med GCP.
permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Samme Dockerfile som deployen bruker, men uten push.
      - name: Bygg container-imaget
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
