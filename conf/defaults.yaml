##################### Regelrett Configuration Defaults #####################
#
# Do not modify this file in regelrett installs
#

base:
  # possible values : production, development
  mode: "production"

#################################### Server ##############################

paths:
  provisioning: conf/provisioning

#################################### Server ##############################

server:
  # The http protocol to use
  protocol: http
  # The http port to use
  http_port: 8080

  # The ip address to bind to, empty will bind to all interfaces
  http_addr: 0.0.0.0

  # The public facing domain name used to access regelrett from a browser
  domain: localhost

  # This is the full URL used to access Grafana from a web browser. This is important if you use OAuth authentication (for the callback URL to be correct).
  # Falls back to <protocol>://<domain>:<port>/ if not set
  root_url: null

  # Log web requests
  router_logging: false

  # Enable timing and debug logging for external service calls (Airtable, Microsoft Graph)
  external_service_timing: false

  # allowed_origins is a comma-separated list of origins that can establish connection with Regelrett Live.
  # If not set then origin will be matched over root_url. Supports wildcard symbol "*".
  allowed_origins: "localhost:5173,localhost:8080"

  # Configure http request limits for the netty server
  max_initial_line_length: 4096
  max_header_size: 8192
  max_chunk_size: 8192

#################################### Auth ##############################

microsoft_graph:
  base_url: "https://graph.microsoft.com"
  member_of_path: "/v1.0/me/memberof/microsoft.graph.group"
  groupfilter: null

oauth:
  base_url: "https://login.microsoftonline.com"
  tenant_id: null
  issuer_path: "/v2.0"
  auth_path: "/oauth2/v2.0/authorize"
  token_path: "/oauth2/v2.0/token"
  jwks_path: "/discovery/v2.0/keys"
  client_id: null
  client_secret: null
  super_user_group: null
  reporting_user_group: null

# Direct verification of GitHub Actions' own OIDC token, checked in addition to
# (not instead of) the normal Entra `auth-jwt` validation on the /api/m2m/slo
# endpoint. See research/m2m/ for why this endpoint needs three independent
# trust chains. audience/expected_repository are fixed facts of this
# codebase, not secrets or per-environment values, so they're real defaults
# here rather than nulls requiring a custom.yaml/k8s override.
github_actions_oidc:
  issuer: "https://token.actions.githubusercontent.com"
  jwks_url: "https://token.actions.githubusercontent.com/.well-known/jwks"
  audience: "api://regelrett-m2m-slo"
  expected_repository: "bekk/Regelrett.sla"
  # e.g. "refs/heads/main" once this leaves POC - null skips the ref check
  expected_ref: null

#################################### Database ##############################

database:
  # You can configure the database connection by specifying type, host, name, user and password
  # as separate properties.

  # Currently only "postgres" is supported.
  host: "127.0.0.1:5433"
  name: "regelrett"
  user: "postgres"
  password: pwd

  # Specify username and password for the db-migration. Usefull when you want to differentiate between privileges for the migration-user and application-user.
  # If not set then migration-username and -password will match user and password set above or defaults.
  migration_user: null
  migration_password: null

  # Max idle conn setting default is 2
  max_idle_conn: 2

  # Max conn setting default is 0 (mean not set)
  max_open_conn: null

  # Connection Max Lifetime default is 14400 (means 14400 seconds or 4 hours)
  conn_max_lifetime: 14400

  # Set to true to log the sql calls and execution times.
  log_queries: false

  # Lock the database for the migrations, default is true.
  migration_locking: true

  # 3000Only if migrationLocking is set. How many seconds to wait before failing to lock the database for the migrations, default is 0.
  locking_attempt_timeout_sec: 0

answer_history_cleanup:
  cleanup_interval_weeks: "4"

#################################### Frontend ##############################

frontend_dev_server:
  http_port: 5173
  host: localhost
  protocol: http
