apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-regelrett
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/part-of: regelrett
spec:
  # Gatewayen ligger i kartverket.dev.sla.
  parentRefs:
    - name: gateway-external
      namespace: ns-gateway
      sectionName: https
  hostnames:
    - regelrett.slo.fleks.dev
  rules:
    - backendRefs:
        - name: service-regelrett
          port: 80
---
# Helsesjekk mot /health i stedet for "/".
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: healthcheckpolicy-regelrett
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/part-of: regelrett
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: service-regelrett
