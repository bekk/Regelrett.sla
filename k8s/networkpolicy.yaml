apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-default-deny-ingress
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/part-of: regelrett
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-allow-backstage-to-regelrett
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/part-of: regelrett
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-regelrett
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ns-backstage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backstage
      ports:
        - protocol: TCP
          port: 8080
---
# Trafikk og helsesjekker fra Googles lastbalanserer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-allow-gclb-to-regelrett
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/part-of: regelrett
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-regelrett
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080
