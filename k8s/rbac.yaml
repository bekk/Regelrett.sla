apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-regelrett-caller-proxy
  namespace: ns-regelrett
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["service-regelrett"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebinding-regelrett-caller-proxy
  namespace: ns-regelrett
subjects:
  - kind: User
    name: sa-github-regelrett-caller@gcp-fleks-grafanaslo.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: role-regelrett-caller-proxy
  apiGroup: rbac.authorization.k8s.io
