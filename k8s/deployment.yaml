apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-regelrett
  namespace: ns-regelrett
  labels:
    app.kubernetes.io/name: spire-regelrett
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-regelrett
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-regelrett
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-regelrett
          # Erstattes ved deploy. Se .github/README.md.
          image: replaced-at-deploy
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-regelrett
            - secretRef:
                name: secret-regelrett-db
            - secretRef:
                name: secret-regelrett-oauth
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: schemasources
              mountPath: /etc/regelrett/provisioning/schemasources
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: schemasources
          secret:
            secretName: secret-regelrett-schemasources